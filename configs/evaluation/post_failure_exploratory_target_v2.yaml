  frame_order: sample_id

# --- metrics: corrected ACER definition (Defect H) --------------------------
metrics:
  levels: [frame, video]
  core: [apcer, bpcer, acer, roc_auc, eer]
  calibration: [ece, brier, nll]
  hter: {retained_only_if_threshold_explicit: true, label: EVALUATION_ONLY_DESCRIPTIVE_METRIC}
  acer_definition:
    apcer: "count(spoof videos predicted NOT spoof) / count(spoof videos)"
    bpcer: "count(live videos predicted spoof) / count(live videos)"
    acer: "0.5 * (apcer + bpcer)"
    never: "a raw class-unweighted error rate (mean(error) over all videos) — the
           frozen target has UNEQUAL live/spoof counts (785 live, 915 spoof), so
           the two differ whenever APCER != BPCER"
  primary_table_columns: [row_id, experiment_id, track, arm, prediction_variant_id, seed,
                          apcer, bpcer, acer, roc_auc, eer, ece, brier, nll]
  per_seed_values_hidden: false
  cross_seed_aggregation: {statistic: [mean, std], ddof: 0}
  attack_wise:
    enabled: true
    computed: POST_HOC_DESCRIPTIVE_TARGET_ANALYSIS
    used_for_model_selection: false
    used_for_threshold_selection: false
    available_only_after_label_unlock: true

# --- exploratory comparisons: 7 atomic pairs (Defect J) ---------------------
exploratory_comparisons:
  naming_convention: E-H (never C-H)
  no_unmatched_comparisons: true
  no_retrospective_comparison_selection_from_target_results: true
  atomic_comparisons:
    E-H1_RND_vs_DET: {family: E-H1, track: G, arms: [RND, DET], matched_seeds: 5}
    E-H1_RND_vs_LLM: {family: E-H1, track: G, arms: [RND, LLM], matched_seeds: 5}
    E-H1_DET_vs_LLM: {family: E-H1, track: G, arms: [DET, LLM], matched_seeds: 5}
    E-H2: {family: E-H2, track: R, arms: [DET, LLM], matched_seeds: 3}
    E-H3: {family: E-H3, track: R, variants: [C-R-LLM, C-R-NOPROMPT], matched_seeds: 3}
    E-H4_DET: {family: E-H4, comparison: "Track-G DET vs Track-R DET", matched_seeds: 3}
    E-H4_LLM: {family: E-H4, comparison: "Track-G LLM vs Track-R LLM", matched_seeds: 3}
  total_atomic_comparisons: 7

# --- statistics: 7-member Holm family + class-stratified paired bootstrap --
statistics:
  bootstrap_unit: video
  bootstrap_resamples: 10000
  bootstrap_seed: 20260810
  confidence_level: 0.95
  interval: percentile
  paired: true
  design: CLASS_STRATIFIED_PAIRED_VIDEO_BOOTSTRAP
  design_steps:
    1: match compared rows by exact seed
    2: verify every compared row scores the same locked target video IDs
    3: partition target video IDs by true class (LIVE, SPOOF) after E2 label unlock
    4: for each of 10000 replicates, sample LIVE video IDs with replacement from LIVE
       only and SPOOF video IDs with replacement from SPOOF only; use the SAME
       sampled IDs for BOTH compared methods and for EVERY matched seed
    5: for each matched seed and replicate, compute APCER/BPCER/ACER for both methods
       from the resampled video IDs; delta_seed = ACER_A - ACER_B
    6: replicate_statistic = mean(delta_seed across ALL matched seeds); seeds are
       fixed replications and are NEVER themselves resampled
    7: observed_statistic = mean over matched seeds of (ACER_A(seed) - ACER_B(seed))
       on the real (non-resampled) video set
    8: CI = 2.5th/97.5th percentile of the 10000 replicate statistics
    9: two-sided p-value from the bootstrap distribution around zero;
       p = min(1, 2*min(P(replicate<=0), P(replicate>=0))); a replicate exactly
       equal to zero counts toward BOTH tail probabilities (inclusive `<=`/`>=`),
       the standard two-sided bootstrap-sign convention — one single frozen
       implementation, never reimplemented per comparison
  comparison_statistic: class_stratified_paired_video_acer_difference
  p_value: two_sided
  multiple_comparison_policy: holm_bonferroni
  family_size: 7
  alpha: 0.05
  seed_summary: {form: "mean+/-std", ddof: 0, minimum_seeds_for_claim: 3}
  no_target_result_may_influence_this_design: true
  exploratory_disclaimer: >-
    every p-value/CI produced under this protocol is EXPLORATORY_COMPARISON
    evidence, never preregistered confirmatory evidence for C-H1..C-H5

required_binding_in_every_output:
  ba_sep_observed_verdict: FAIL
  detector_reliability_overall: FAILED
  post_failure_diagnostics_v2: FAIL
  c9_original_confirmatory_path: BLOCKED
  exploratory_target_status: POST_FAILURE_EXPLORATORY

no_rerun_policy:
  prediction:
    no_artifacts: run once
    complete_valid_lockset: validate/re-report only, zero inference
    partial: BLOCK (see phase_e1_blind_prediction.partial_result_cases)
  scoring:
    no_artifacts: score once from the immutable prediction lockset
    complete_valid_result: validate/re-report only
    partial: BLOCK
  never_overwrite_a_valid_scientific_result: true

implementation:
