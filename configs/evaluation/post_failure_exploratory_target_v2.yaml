# ============================================================================
# PHASE E1 — blind target prediction, PREDICTION_PLAN_BINDING is authoritative
# ============================================================================
phase_e1_blind_prediction:
  authoritative_execution_source: PREDICTION_PLAN_BINDING.json
  binding_must_include_every_result_affecting_field: [row_id, experiment_id, track, arm,
    protocol, seed, flags, config_identity, run_identity, checkpoint_relative_path,
    checkpoint_sha256, checkpoint_kind, decision_logit_name, decision_score_name,
    decision_graph_hash, calibration_hash, calibration_split, threshold, temperature,
    prediction_variant_id]
  before_predict: >-
    recompute the candidate binding READ-ONLY (identical resolution as
    --bind-prediction-plan) and require EXACT equality with the frozen
    PREDICTION_PLAN_BINDING.json; any difference BLOCKS, never silently
    executes from freshly resolved values
  package_verification_required_before_bind:
    present_on_this_host: true
    verified: true
    computed_identity_equals_expected: true
  prediction_variant_id: row.experiment_id   # NEVER row.arm alone
  prediction_lockset_artifact: TARGET_PREDICTION_LOCK.json
  prediction_lockset_primary_key: row_id   # NOT experiment_id
  prediction_lockset_entry_count_required: 24
  prediction_lockset_binds:
    - v2_protocol_identity
    - target_matrix_identity
    - c8_matrix_identity
    - target_feature_package_identity
    - prediction_plan_binding_identity
    - all_24_row_entries (row_id, experiment_id, track, arm, seed, prediction_variant_id,
      checkpoint_sha256, calibration_hash, threshold, temperature, inference_config_hash,
      prediction_logical_identity, prediction_file_sha256, per_row_prediction_lock_identity,
      row_count, video_count)
    - target_labels_opened: false
    - status: FROZEN
  partial_result_cases:
    zero_final_artifacts: first execution permitted
    one_to_twentythree_rows_complete: BLOCK PARTIAL_SCIENTIFIC_RESULT_SET
    twentyfour_predictions_bad_or_missing_overall_lock: BLOCK
    overall_lock_present_rows_missing_or_invalid: BLOCK
  existing_result_validation: validate_existing_exploratory_prediction_result
  second_predict_after_valid_first_execution:
    checkpoint_weights_loaded: false
    images_forwarded: false
    prediction_recomputed: false

# ============================================================================
# PHASE E2 — label unlock + scoring
# ============================================================================
phase_e2_label_unlock_scoring:
  precondition: valid_frozen_24_row_prediction_lockset
  row_metadata_source_of_authority: validated frozen prediction plan / lock (never a
    fresh source_matrix re-resolution)
  scorer_may_read: [target_label_artifact, locked_prediction_files]
  scorer_may_not: [load_model_checkpoints, rerun_inference, alter_predictions,
                   train_anything, calibrate_thresholds, select_checkpoints]
  scorer_writes_only: [metrics, tables, statistics]
  existing_result_validation: validate_existing_exploratory_score_result
  label_reveal_artifact_binds: [v2_protocol_identity, prediction_lock_identity,
    label_artifact_identity_hash, first_authorized_reveal]

