# ============================================================================
# EXECUTABLE_WITH_NEW_FROZEN_PROTOCOL — the three benign-corruption tests
# ============================================================================
#
# Population and split design unchanged from V1 (source_dev LIVE only, both
# domains, group-safe 50/50 split on source_record_id, namespace
# "c9-post-failure-diagnostics-v1" — the SPLIT RULE is reused verbatim so the
# calibration/evaluation partition of source_dev LIVE is identical to V1's;
# only the THRESHOLD DERIVATION changes (Defect A correction below).
#
# Defect A correction — disjoint reference-calibration design:
#
#   REFERENCE BENIGN CONTROLS (frozen independently at M8/C6, NEVER the
#   corruption under test)
#       -> forwarded on the CALIBRATION group only
#       -> source-only calibration tolerance (tau_mean, tau_tail)
#       -> held-out JPEG/resize/color evaluation, forwarded on the
#          EVALUATION group only, scored against the fixed tau
#
# The tested corruption NEVER contributes to its own threshold: the
# calibration group is forwarded ONLY through the pre-existing REFERENCE
# benign perturbations (never JPEG/resize/color), and the evaluation group is
# forwarded ONLY through the corruption under test (never the reference
# perturbations). Disjoint by sample-group (calibration vs evaluation) AND by
# perturbation family (reference vs tested corruption).

benign_corruption_shared:
  population: source_dev LIVE only, both domains (casia_fasd, msu_mfsd)
  stable_grouping_identity: source_record_id
  split_hash_namespace: c9-post-failure-diagnostics-v1   # unchanged split rule
  split_seed: 20260806
  split_fraction: 0.5
  evidence_fields: [global_logit_G, p_global]
  metric_field: p_global
  positive_shift_only: true   # delta_plus = max(p_after - p_before, 0)
  degenerate_group_rule: FAIL_CLOSED
  per_arm_required: true
  per_domain_group_safety_required: true   # Defect E correction
  per_domain_group_safety_domains: [casia_fasd, msu_mfsd]

  reference_benign_controls:
    frozen_at: M8 quality-gate calibration (§11.4), pre-existing and
               independent of this diagnostics protocol
    source_module: prism_fas.synthesis.quality_calibration
    reused_function: prism_fas.synthesis.quality_calibration.benign_variant
                     (verbatim reuse; never a second perturbation
                     implementation)
    variants: [brightness_098, brightness_102, contrast_098, contrast_102]
    variant_definitions:
      brightness_098: {brightness: 0.98, contrast: 1.0}
      brightness_102: {brightness: 1.02, contrast: 1.0}
      contrast_098: {brightness: 1.0, contrast: 0.98}
      contrast_102: {brightness: 1.0, contrast: 1.02}
    gaussian_noise_std: 0.002   # quality_calibration.BENIGN_NOISE_STD, frozen
    applied_to: calibration group only (never evaluation, never the tested
               corruption's own population)
    measure: delta_plus per (calibration sample, reference variant), pooled
            across the 4 variants, averaged over the arm's 5 checkpoints
            exactly as the tested corruption's own evidence is
    independence_rationale: >-
      brightness/contrast/Gaussian-noise perturbations were frozen
      independently at M8 for synthesis quality-gate calibration
      (tau_id/tau_lm/tau_parse), computed on a disjoint metric space
      (identity cosine, landmark NME, parsing dice) over source_train, long
      before this diagnostics protocol existed and for an unrelated purpose.
      Reusing their exact, already-frozen pixel-level transform as the
      REFERENCE stimulus for this protocol's OWN detector-p_global-shift
      measurement introduces no new invented perturbation parameter; only the
      measurement (forwarding through the C9 diagnostic checkpoints) is new,
      and that measurement is identical in kind to what the tested corruption
      itself already receives.

  threshold_derivation:
    statistic_source: pooled reference delta_plus values from the
                      CALIBRATION group only (never the evaluation group,
                      never the tested corruption)
    reference_mean: mean(reference_delta_plus)
    reference_std: std(reference_delta_plus, ddof=0)   # population std
    reference_p95: percentile(reference_delta_plus, 95)
    tau_mean: reference_mean + 3 * reference_std
    tau_tail: reference_p95 + 3 * reference_std   # same +3*std margin,
                                                  # applied to the reference's
                                                  # own tail statistic rather
                                                  # than inventing a new
                                                  # numerical constant
    formula_mean: "reference_mean_delta_plus + 3 * reference_std_delta_plus"
    formula_tail: "reference_p95_delta_plus + 3 * reference_std_delta_plus"
  pass_rule: >-
    evaluation_group.mean(delta_plus) <= tau_mean AND
    evaluation_group.p95(delta_plus) <= tau_tail   (both required; ties PASS
    on each, matching the project's existing <= convention)
  protects_against: [systematic_mean_increase, large_upper_tail_increase]
  ties_pass: true

tests:
  benign_jpeg_corruption:
    classification: EXECUTABLE_WITH_NEW_FROZEN_PROTOCOL
    gpu_ready: true
    spec_reference: "17.3.2"
    scientific_question: >-
      Does a benign, content-preserving JPEG re-encode of a genuinely live
      frame shift the detector's spoof probability upward BEYOND the range of
      natural shift already observed under known-benign M8 reference
      perturbations (brightness/contrast/Gaussian noise), indicating the
      detector reads compression artefacts rather than attack physics?
    perturbation:
      operation: JPEG_RE_ENCODE
      backend: PIL.Image (Pillow)
      encode_format: JPEG
      quality: 50
      subsampling: "4:2:0 (PIL default at this quality)"
      color_order_in: RGB
      decode_after_encode: true
      output_dtype: float32, [0,1] range, identical post-decode normalization
                    to the frozen M9 loader
      deterministic: true
      implementation: prism_fas.evaluation.post_failure_diagnostics.jpeg_corrupt
                       (reused verbatim from V1; never reimplemented)
    reported_fields: [samples, mean_delta_plus, p95_delta_plus, tau_mean, tau_tail]
  benign_resize_corruption:
    classification: EXECUTABLE_WITH_NEW_FROZEN_PROTOCOL
    gpu_ready: true
    spec_reference: "17.3.2"
    scientific_question: >-
      Does a benign downscale/upscale resampling chain on a live frame shift
      the detector's spoof probability upward BEYOND the reference benign
      variability, indicating the detector reads resampling artefacts rather
      than attack physics?
    perturbation:
      operation: DOWNSCALE_THEN_UPSCALE
      backend: PIL.Image (Pillow)
      downscale_factor: 0.5
      interpolation_down: BILINEAR
      interpolation_up: BILINEAR
      output_size: [224, 224]
      aspect_ratio_changed: false
      deterministic: true
      implementation: prism_fas.evaluation.post_failure_diagnostics.resize_corrupt
                       (reused verbatim from V1; never reimplemented)
    reported_fields: [samples, mean_delta_plus, p95_delta_plus, tau_mean, tau_tail]
  benign_color_corruption:
    classification: EXECUTABLE_WITH_NEW_FROZEN_PROTOCOL
    gpu_ready: true
    spec_reference: "17.3.2"
    scientific_question: >-
      Does a benign per-channel color gain shift on a live frame shift the
      detector's spoof probability upward BEYOND the reference benign
      variability, indicating the detector reads color statistics rather than
      attack physics?
    perturbation:
      operation: RGB_CHANNEL_GAIN
      color_space: RGB, [0,1] range (post-loader normalization)
      gain: {R: 1.15, G: 1.00, B: 0.90}
      clipping: "[0, 1], applied after gain"
      deterministic: true
      implementation: prism_fas.evaluation.post_failure_diagnostics.color_corrupt
                       (reused verbatim from V1; never reimplemented)
    reported_fields: [samples, mean_delta_plus, p95_delta_plus, tau_mean, tau_tail]

# ============================================================================
# NEEDS_SCIENTIFIC_DECISION — cross_route_synthetic (Defect B correction)
# ============================================================================
  cross_route_synthetic:
    classification: NEEDS_SCIENTIFIC_DECISION
    gpu_ready: false
    spec_reference: "17.3.7"
    blocked_reason: >-
      V1 reused the frozen BA_sep <= 0.75 real-vs-synthetic SEPARABILITY
      ceiling (where LOW balanced accuracy is the desired outcome) to score a
      test it labeled "cross-route performance retention". The canonical
      declared definition of this test
      (prism_fas.evaluation.reliability.DECLARED_TESTS["cross_route_synthetic"],
      spec §17.3.7) states: population "train on one synthetic route,
      evaluate on the other"; measures "cross-route generalization of the
      synthetic evidence"; pass_rule "performance is retained across routes".
      That is a RETENTION question (does detection/generalization
      PERFORMANCE stay high across routes) — the opposite scientific
      direction from a SEPARABILITY ceiling (where staying LOW is good). No
      already-frozen, faithful definition of "performance" (which metric:
      spoof-detection accuracy? AUC? something else), "within-route
      reference" (what performance level counts as "retained" relative to),
      or a numeric acceptance threshold for retention exists anywhere in this
      repository or spec section 17.3.7. Reusing the BA_sep ceiling under the
      "cross_route_synthetic" name therefore risks silently reversing the
      test's own declared scientific meaning. V1's separability-probe
      attempt is preserved as historical evidence
      (`prism_fas.evaluation.post_failure_diagnostics.resolve_synthetic_population_by_route`,
      `cross_route_ba`, `run_cross_route_diagnostic_for_arm` — unchanged,
      unused by V2) but is not executed under this name. Per §5.B of the
      correction task, reusing a frozen threshold is legitimate only when its
      scientific meaning is unchanged by the substitution; here it is not.
    audit_performed: true
    reaudited_this_task: true
    v1_attempt_preserved_as: >-
      prism_fas.evaluation.post_failure_diagnostics.run_cross_route_diagnostic_for_arm
      (unchanged; not called by V2's runner)
    would_become_executable_if: >-
      a normative audit or explicit user decision freezes: (1) which
      performance metric "retention" measures, (2) the within-route reference
      value performance is retained RELATIVE TO, and (3) a numeric acceptance
      threshold for that retention — none invented here.

# ============================================================================
# NEEDS_SCIENTIFIC_DECISION / STRUCTURALLY_MODEL_BLOCKED — unchanged from V1
# ============================================================================
  residual_scale_zero:
    classification: STRUCTURALLY_MODEL_BLOCKED
    gpu_ready: false
    spec_reference: "17.3.3"
    blocked_reason: >-
      Unchanged from V1's re-audit. Two independent blockers, either alone
      sufficient. (1) The declared population — "source_train live with the
      GPAT residual scaled to 0" — requires re-running the GPAT synthesis
      generator at a modified residual scale, which is a SYNTHESIS-time
      operation over the frozen C6 banks; this task and the frozen C6/C8
      identities forbid regenerating or altering any C6 bank, and no code
      path in this repository exposes a "forward the GPAT generator with
      residual_scale=0 without writing a new bank entry" primitive. (2) The
      declared measurement includes "regional distance"
      (output.region_distances in src/prism_fas/detector/contracts.py),
      which is populated only when `self.manifold is not None`
      (src/prism_fas/detector/prism_detector.py) — true only for the
      secondary TRACK_R_K4_FLAGS variant (manifold: multi_prototype), never
      for Track G or primary Track R (DET/LLM), which are the only variants
      with real, trained, P3-ready Version-C checkpoints. Substituting a
      global proxy for regional distance is explicitly forbidden by this
      task.
    audit_performed: true
    reaudited_this_task: false
    unchanged_from_v1: true
  recipe_region_shift:
    classification: NEEDS_SCIENTIFIC_DECISION
    gpu_ready: false
    spec_reference: "17.3.4"
    blocked_reason: >-
      Unchanged from V1's re-audit. `region_embeddings` and the fusion's own
      `region_attention` softmax weights ARE populated for primary Track R
      (DET/LLM; gated by `variant.has_region_path`, true whenever
      `region: on`, independent of manifold —
      src/prism_fas/detector/prism_detector.py forward()). What remains
      undecided is WHICH existing signal constitutes the spec's "anomaly
      heat-map peak" — `region_attention` (the fusion's own per-region
      weighting) and a distance-from-mean over `region_embeddings` are both
      plausible, non-equivalent candidates, and choosing one is a NEW
      scientific choice this task does not make silently. Additionally
      unverified: whether the frozen M7 recipe bank actually contains recipe
      PAIRS differing only in attacked region.
    audit_performed: true
    reaudited_this_task: false
    unchanged_from_v1: true
    evidence_now_known_available: [region_embeddings, region_attention]
    evidence_still_unavailable: [region_distances (needs manifold, absent from primary rows)]
  artifact_map_swap:
    classification: NEEDS_SCIENTIFIC_DECISION
    gpu_ready: false
    spec_reference: "17.3.5"
    blocked_reason: >-
      Unchanged from V1's re-audit. `local_logits` IS populated for primary
      Track R (DET/LLM; gated by `variant.has_local`, true for Track R's
      `local_branch: convnext` — src/prism_fas/detector/prism_detector.py
      forward()), `attack_region_mask` already exists per accepted C6 bank
      row (used to train `L_local` today —
      src/prism_fas/detector/losses.py::weighted_local_loss,
      compute_losses), and a "swap" (pairing one sample's local_logits with
      ANOTHER sample's attack_region_mask) is constructible from data
      already in the frozen bank without regenerating anything. What is NOT
      frozen: a specific alignment/degradation METRIC (weighted_local_loss
      is a TRAINING loss with its own weighting policy, not yet adapted into
      a read-only diagnostic score) and its acceptance threshold.
    audit_performed: true
    reaudited_this_task: false
    unchanged_from_v1: true
    evidence_now_known_available: [local_logits, attack_region_mask, weighted_local_loss (training-only today)]
  crop_padding_interpolation:
    classification: STRUCTURALLY_DATA_BLOCKED
    gpu_ready: false
    spec_reference: "17.3.6"
    blocked_reason: >-
      Unchanged from V1's re-audit. The frozen prism_data_v1_m3b package's
      manifests/samples.parquet stores only the 224x224 crop and its hash —
      no bounding-box column, no path back to the original source frame.
      Reproducing the intended crop-padding perturbation needs the original
      frame and the detected bounding box, neither retained. Re-opening the
      raw video tree is outside the frozen diagnostic contract. Re-deriving
      a padding perturbation from the already-cropped image would measure
      resampling — the same quantity benign_resize_corruption already
      measures — under a different name.
    audit_performed: true
    reaudited_this_task: false
    unchanged_from_v1: true

