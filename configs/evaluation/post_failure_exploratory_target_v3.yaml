decision_id: POST_FAILURE_EXPLORATORY_TARGET_V3
status: FROZEN_NOT_RUN
document_kind: EXPLORATORY_POST_FAILURE_NOT_A_CONFIRMATORY_PATH
frozen_on: "2026-08-26"
