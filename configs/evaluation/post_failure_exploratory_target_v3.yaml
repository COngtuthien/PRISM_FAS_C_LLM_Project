                        reports/full/exploratory_target_v2, runs/exploratory_target_v2,
                        state/exploratory_target_v1, state/exploratory_target_v2]
  never_writes_into: [reports/full/c9, reports/full/c10, reports/full/c11,
                      reports/full/c12, reports/full/c13, runs/full/c8,
                      reports/full/c8/reliability/synthetic_vs_real_spoof_probe,
                      reports/full/c8/reliability/post_failure_source_diagnostics_v1,
                      reports/full/c8/reliability/post_failure_source_diagnostics_v2,
                      reports/full/c8/DETECTOR_RELIABILITY_LOCK_C.json,
                      reports/full/c8/C8_ACCEPTANCE.json]

legacy_m10_reuse:
  legacy_config_path: configs/evaluation/m10_target.yaml
  legacy_config_treated_as: LEGACY_CONTRACT_SOURCE_OF_DESIGN_DECISIONS_ONLY
  legacy_config_never_loaded_as_this_protocol: true
  legacy_config_left_untouched: true
  v1_and_v2_predictor_and_scorer_modules_left_untouched: true
  reused_verbatim_from_v1_module: [resolve_target_matrix, target_matrix_identity,
    resolve_row_binding, bind_c8_matrix_identity, compute_target_feature_package_identity,
    verify_target_feature_package_expected, verify_target_label_root_sealed, build_firewall]
  reused_verbatim_from_v2_module: [resolve_all_row_bindings_v2, verify_target_feature_package_required]
  reused_verbatim_legacy_m10_components: [target_prediction.PREDICTION_SCHEMA,
    target_prediction.build_prediction_row, target_prediction.validate_predictions,
    target_prediction.write_predictions, target_prediction.read_predictions,
    target_prediction.build_prediction_lock (now passed code_commit, a parameter
    it already supported but V2 never populated),
    target_prediction.validate_prediction_lock, target_prediction.inference_config_hash,
    target_prediction.target_batches, target_prediction.predict_target,
    synthetic_real_probe.construct_row_trainer, scoring.score,
    scoring.load_evaluation_labels, scoring.static_import_audit, contracts.stable_identity,
    detector.checkpoint.git_commit]
  not_reused_because_defective_in_v2: [post_failure_exploratory_target_v2.class_stratified_paired_bootstrap
    (its p_value_two_sided came from the bootstrap distribution itself; V3 keeps
    it for CI only and freezes a separate paired randomization test for p-values)]
  intentionally_changed_semantics_vs_v2:
    - field: per_row_target_feature_package_identity
      v2: "binding.get('target_feature_package_identity', '') resolved to an EMPTY STRING — the field was never actually bound per row"
      v3: "every row's binding carries the real, top-level VERIFIED computed target_feature_package_identity; inference_config_hash, the per-row lock, and the validator all require exact equality with it"
    - field: code_commit_provenance
      v2: "build_prediction_lock's own code_commit parameter was never populated (left at its default empty string)"
      v3: "the current git commit is determined ONCE at E1 execution start (prediction_execution_code_commit) and passed into every per-row lock and the overall lockset; a second --predict verifies the recorded lineage without rerunning anything"
    - field: target_access
      v2: "a single ambiguous target_access: 0 field, blind to feature-identity vs prediction-feature vs label reads"
      v3: "target_access_state, an explicit three-boolean-plus-counts object, frozen with exact before/after semantics per access type"
    - field: label_reveal
      v2: "TARGET_LABEL_REVEAL.json was declared in prose but never implemented; the scorer called load_evaluation_labels directly"
      v3: "reveal_target_labels() writes a real, one-way TARGET_LABEL_REVEAL.json BEFORE the first label load, binding the prediction lock identity and the label artifact's own SHA-256"
    - field: score_completeness
      v2: "24 complete per-row score files with no final result would be rescored on the next --score call, reopening labels unnecessarily"
      v3: "that exact state is INCOMPLETE_FINALIZATION and BLOCKS — no label reopen, no row rewrite; only a genuinely empty host may start fresh"
    - field: exploratory_p_value
      v2: "p_value_two_sided came from the same bootstrap distribution used for the CI"
      v3: "the bootstrap is CI-only; p-values come from a separate, frozen paired video-level sign-flip randomization test with a distinct RNG stream"
    - field: matched_seeds
      v2: "matched seeds were whatever set(a) & set(b) happened to produce, unasserted"
      v3: "every comparison's matched-seed set is asserted EXACTLY against the frozen expectation; any missing seed BLOCKS rather than silently reducing the family"
    - field: cross_seed_summary
      v2: "no canonical per-configuration mean/std artifact was produced"
      v3: "build_cross_seed_summary emits, for each of the 6 configurations and each of the 8 metrics, the per-seed values plus mean/std(ddof=0) over the complete frozen seed family — never a prediction pooled across seeds"
    - field: crash_safety
      v2: "row prediction/score artifacts were written directly to their final scientific location; a mid-run crash left a permanently partial scientific result"
      v3: "inference and per-row scoring write to a non-scientific staging namespace (ENGINEERING_STAGING_NOT_SCIENTIFICALLY_LOCKED) first; only after all 24 rows succeed and validate are they promoted into the final row directories, with the overall lock/result written last"

