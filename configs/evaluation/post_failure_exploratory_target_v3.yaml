# --- explicit target access state (Defect C) --------------------------------
# `target_access` is retired for this protocol's own artifacts — it conflated
# three genuinely different accesses. Every V3 artifact carries this object
# instead, and NEVER claims all-false once a real access has occurred.
target_access_state:
  target_feature_identity_accessed: false
  target_prediction_features_accessed: false
  target_labels_accessed: false
  target_feature_access_count: 0
  target_label_access_count: 0
  semantics:
    initial: {feature_identity_accessed: false, prediction_features_accessed: false, labels_accessed: false}
    after_gpu_feature_package_identity_verification: {feature_identity_accessed: true, prediction_features_accessed: false, labels_accessed: false}
    after_successful_e1_prediction: {feature_identity_accessed: true, prediction_features_accessed: true, labels_accessed: false}
    after_authorized_e2_reveal: {feature_identity_accessed: true, prediction_features_accessed: true, labels_accessed: true}
  rule: >-
    no artifact may claim target_access=0 (or any all-false access state)
    after a real target feature or label read; backward-compatibility
    fields may exist but must never misrepresent what was opened

target_labels_opened: false
target_labels_revealed: false
target_predictions_observed: false
target_metrics_observed: false

# --- namespaces — disjoint from V1/V2 and from C9-C13 -----------------------
namespaces:
  config: configs/evaluation/post_failure_exploratory_target_v3.yaml
  report_root: reports/full/exploratory_target_v3
  run_root: runs/exploratory_target_v3
  staging_root: runs/exploratory_target_v3/.staging
  state_root: state/exploratory_target_v3
