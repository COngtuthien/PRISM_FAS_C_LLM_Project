# ============================================================================
# PHASE E1 — blind target prediction
# ============================================================================
phase_e1_blind_prediction:
  authoritative_execution_source: PREDICTION_PLAN_BINDING.json
  binding_must_include_every_result_affecting_field: [row_id, experiment_id, track, arm,
    protocol, seed, flags, config_identity, run_identity, checkpoint_relative_path,
    checkpoint_sha256, checkpoint_kind, decision_logit_name, decision_score_name,
    decision_graph_hash, calibration_hash, calibration_split, threshold, temperature,
    prediction_variant_id, target_feature_package_identity]
  code_commit_determined_once_at_execution_start: true
  code_commit_field: prediction_execution_code_commit
  staging:
    root: runs/exploratory_target_v3/.staging/<execution_identity>
    marker: ENGINEERING_STAGING_NOT_SCIENTIFICALLY_LOCKED
    promotion: atomic per-row rename into the final scientific row directory, only
              after ALL 24 rows succeed and individually validate; the overall
              TARGET_PREDICTION_LOCK.json is written LAST, after every row is promoted
    on_crash_before_promotion: staging may be discarded/restarted; no scientific
                               prediction result was ever frozen or published
  prediction_lockset_artifact: TARGET_PREDICTION_LOCK.json
  prediction_lockset_primary_key: row_id
  prediction_lockset_entry_count_required: 24
  prediction_lockset_binds: [v3_protocol_identity, target_matrix_identity, c8_matrix_identity,
    target_feature_package_identity, prediction_plan_binding_identity,
    prediction_execution_code_commit, all_24_row_entries, target_labels_accessed: false,
    status: FROZEN]
  partial_result_cases:
    zero_final_artifacts: first execution permitted (staging is disposable and ignored)
    one_to_twentythree_rows_complete: BLOCK PARTIAL_SCIENTIFIC_RESULT_SET
    twentyfour_predictions_bad_or_missing_overall_lock: BLOCK
    overall_lock_present_rows_missing_or_invalid: BLOCK
    extra_run_directories_not_in_the_frozen_row_set: BLOCK
  existing_result_validation: validate_existing_exploratory_prediction_result_v3
  second_predict_after_valid_first_execution:
    checkpoint_weights_loaded: false
    images_forwarded: false
    prediction_recomputed: false
    code_lineage_reverified_not_rerun: true

# ============================================================================
# PHASE E2 — label unlock + scoring
# ============================================================================
phase_e2_label_unlock_scoring:
  precondition: valid_frozen_24_row_prediction_lockset
  label_reveal:
    artifact: reports/full/exploratory_target_v3/TARGET_LABEL_REVEAL.json
    one_way: true
    binds: [protocol_identity, prediction_plan_binding_identity,
           target_prediction_lock_identity, target_label_artifact_relative_path,
           target_label_artifact_sha256, first_authorized_reveal_code_commit,
           target_labels_accessed: true, reason: POST_FAILURE_EXPLORATORY_E2_SCORING,
           ba_sep_observed_verdict: FAIL, detector_reliability_overall: FAILED,
           post_failure_diagnostics_v2: FAIL, c9_original_confirmatory_path: BLOCKED]
    sequence: [validate_full_e1_prediction_lock, verify_scorer_has_no_model_capability,
              verify_label_artifact_exists, hash_label_artifact_without_scoring,
              atomically_create_one_way_reveal, then_load_labels, then_score_from_immutable_predictions]
    existing_reveal: {exact_match: reuse, mismatch: BLOCK, never_overwrite: true}
    once_created_labels_accessed_can_never_return_to_false: true
  staging:
    root: runs/exploratory_target_v3/.staging/<execution_identity>/scores
    promotion: same pattern as E1 — per-row score files promoted atomically only
              after all 24 rows score successfully; the final
              EXPLORATORY_TARGET_SCORE_RESULT.json is written last
  score_state_machine:
    zero_row_files_no_final_result: first scoring execution allowed
    one_to_twentythree_row_files: PARTIAL_SCIENTIFIC_RESULT_SET -> BLOCK
    twentyfour_row_files_no_final_result: INCOMPLETE_FINALIZATION -> BLOCK, no label
      reopen, no row rewrite
    final_result_missing_or_invalid_row_file: BLOCK
    final_result_and_24_valid_row_files: validate/re-report only, no label reopen,
      no rescoring
    extra_or_unexpected_row_files: BLOCK
    duplicate_scientific_row_identity: BLOCK
  row_metadata_source_of_authority: validated frozen prediction plan / lock
  scorer_may_read: [target_label_artifact, locked_prediction_files]
  scorer_may_not: [load_model_checkpoints, rerun_inference, alter_predictions,
                   train_anything, calibrate_thresholds, select_checkpoints]
  scorer_writes_only: [metrics, tables, statistics]
  existing_result_validation: validate_existing_exploratory_score_result_v3

# --- exact C8 P3 target matrix (unchanged) ----------------------------------
target_matrix:
  resolver: prism_fas.evaluation.source_matrix.build_plan
  filter: row.target_prediction_required is True
  expected_total_rows: 24
  expected_track_g: {total: 15, arms: [RND, DET, LLM], seeds_per_arm: 5,
                    seed_family: [20260806, 20260807, 20260808, 20260809, 20260810]}
  expected_track_r:
    C-R-DET: {seeds: 3, seed_family: [20260806, 20260807, 20260808]}
    C-R-LLM: {seeds: 3, seed_family: [20260806, 20260807, 20260808]}
    C-R-NOPROMPT: {seeds: 3, seed_family: [20260806, 20260807, 20260808], arm: LLM, prompt: "off"}
  no_retraining: true
  no_best_seed_selection: true
  no_dropping_unfavorable_arms: true

thresholds:
  source: SOURCE_DEV_FROZEN_CALIBRATION
  target_quantile_forbidden_for_operating_threshold: true
  acer_threshold_source: source_dev_frozen
  hter_at_target_eer: {retained: true, label: EVALUATION_ONLY_DESCRIPTIVE_METRIC}

reject_policy:
  unknown_threshold: null
  reject_policy: NOT_APPLICABLE_NOT_FITTED
  reject_dependent_metrics: NOT_APPLICABLE

aggregation:
  resolver: prism_fas.evaluation.video_aggregation.aggregate_frames
  frames_per_video: 4
  video_score: trimmed_mean
  trim_fraction: 0.10
  trim_count_at_four_frames: 0
  video_confidence: median
  group_by: video_id
  frame_order: sample_id

metrics:
  levels: [frame, video]
  core: [apcer, bpcer, acer, roc_auc, eer]
  calibration: [ece, brier, nll]
  hter: {retained_only_if_threshold_explicit: true, label: EVALUATION_ONLY_DESCRIPTIVE_METRIC}
  acer_definition:
    apcer: "count(spoof videos predicted NOT spoof) / count(spoof videos)"
    bpcer: "count(live videos predicted spoof) / count(live videos)"
    acer: "0.5 * (apcer + bpcer)"
  primary_table_columns: [row_id, experiment_id, track, arm, prediction_variant_id, seed,
                          apcer, bpcer, acer, roc_auc, eer, ece, brier, nll]
  per_seed_values_hidden: false
  cross_seed_summary:
    required: true
    configurations: [C-G-RND, C-G-DET, C-G-LLM, C-R-DET, C-R-LLM, C-R-NOPROMPT]
    per_metric: [apcer, bpcer, acer, roc_auc, eer, ece, brier, nll]
    statistic: [seeds, per_seed, mean, std_ddof0]
    ddof: 0
    all_frozen_seeds_must_be_present: true
    never_pool_predictions_across_seeds: true
  attack_wise:
    enabled: true
    computed: POST_HOC_DESCRIPTIVE_TARGET_ANALYSIS
    used_for_model_selection: false
    used_for_threshold_selection: false
    available_only_after_label_unlock: true

# --- exploratory comparisons: 7 atomic pairs, exact matched seeds ----------
exploratory_comparisons:
  naming_convention: E-H (never C-H)
  no_unmatched_comparisons: true
  no_retrospective_comparison_selection_from_target_results: true
  atomic_comparisons:
    E-H1_RND_vs_DET: {family: E-H1, track: G, arms: [RND, DET], required_matched_seeds: [20260806, 20260807, 20260808, 20260809, 20260810]}
    E-H1_RND_vs_LLM: {family: E-H1, track: G, arms: [RND, LLM], required_matched_seeds: [20260806, 20260807, 20260808, 20260809, 20260810]}
    E-H1_DET_vs_LLM: {family: E-H1, track: G, arms: [DET, LLM], required_matched_seeds: [20260806, 20260807, 20260808, 20260809, 20260810]}
    E-H2: {family: E-H2, track: R, arms: [DET, LLM], required_matched_seeds: [20260806, 20260807, 20260808]}
    E-H3: {family: E-H3, track: R, variants: [C-R-LLM, C-R-NOPROMPT], required_matched_seeds: [20260806, 20260807, 20260808]}
    E-H4_DET: {family: E-H4, comparison: "Track-G DET vs Track-R DET", required_matched_seeds: [20260806, 20260807, 20260808]}
    E-H4_LLM: {family: E-H4, comparison: "Track-G LLM vs Track-R LLM", required_matched_seeds: [20260806, 20260807, 20260808]}
  total_atomic_comparisons: 7
  exact_matched_seed_assertion_required: true
  missing_seed_policy: BLOCK — no silent dropping of a seed

# --- statistics: bootstrap CI separated from randomization p-value ---------
statistics:
  bootstrap_ci:
    bootstrap_unit: video
    bootstrap_resamples: 10000
    bootstrap_seed: 20260810
    confidence_level: 0.95
    interval: percentile
    paired: true
    class_stratified: true
    seeds_are_fixed_replications_never_resampled: true
    same_sampled_video_ids_for_both_methods_and_all_matched_seeds: true
    statistic: "mean over matched seeds of (ACER_A(seed) - ACER_B(seed))"
    used_for: CI_ONLY
    never_used_for: p_value
  paired_randomization_test:
    unit: video
    resamples: 10000
    seed: 20260810
    two_sided: true
    per_video_contribution:
      spoof_videos: "mean over matched seeds of (APCER_error_A - APCER_error_B) * 1/(2*N_spoof)"
      live_videos: "mean over matched seeds of (BPCER_error_A - BPCER_error_B) * 1/(2*N_live)"
      sum_of_contributions_equals: "mean_seed(ACER_A - ACER_B)"
    null_procedure: "independently assign +1/-1 to each video's contribution (same sign
                    across all matched seeds for that video, since averaging is linear
                    and the video is the paired observational unit)"
    observed_statistic: absolute mean-seed ACER difference
    p_value_formula: "(1 + count(|T_perm| >= |T_obs|)) / (1 + resamples)"
    tie_handling: ">= inclusive, matching the finite-sample correction numerator/denominator"
    used_for: p_value_ONLY
    never_used_for: confidence_interval
    frozen_before_target_access: true
    never_changed_after_target_labels_observed: true
  multiple_comparison_policy: holm_bonferroni
  family_size: 7
  alpha: 0.05
  holm_input: the seven RANDOMIZATION p-values (never the bootstrap p-value)
  seed_summary: {form: "mean+/-std", ddof: 0, minimum_seeds_for_claim: 3}
  exploratory_disclaimer: >-
    every p-value/CI produced under this protocol is EXPLORATORY_COMPARISON
    evidence, never preregistered confirmatory evidence for C-H1..C-H5

required_binding_in_every_output:
  ba_sep_observed_verdict: FAIL
  detector_reliability_overall: FAILED
  post_failure_diagnostics_v2: FAIL
  c9_original_confirmatory_path: BLOCKED
  exploratory_target_status: POST_FAILURE_EXPLORATORY

implementation:
  predictor_module: src/prism_fas/evaluation/post_failure_exploratory_target_v3.py
  predictor_cli: python -m prism_fas.evaluation.post_failure_exploratory_target_v3 --repo . {--preflight-only|--bind-prediction-plan|--status|--predict}
  scorer_module: src/prism_fas/evaluation/post_failure_exploratory_target_v3_scorer.py
  scorer_cli: python -m prism_fas.evaluation.post_failure_exploratory_target_v3_scorer --repo . {--preflight-score|--score}
  v1_and_v2_modules_left_completely_unchanged: true
  laptop_authorized: [audit, config, preflight, binding, firewall, prediction_runner_scaffolding,
                      scorer_scaffolding, unit_fixture_tests, documentation, protocol_identity,
                      commit, push]
  laptop_forbidden: [open_target_feature_package_for_real, open_target_labels,
                     run_siw_mv2_inference, compute_target_metrics, fabricate_target_results,
                     claim_gpu_target_verification]
  laptop_target_access_state_at_end_of_task:
    target_feature_identity_accessed: false
    target_prediction_features_accessed: false
    target_labels_accessed: false
