# POST_FAILURE_EXPLORATORY_TARGET_V3
#
# FINAL PRE-TARGET PROVENANCE / ACCESS / STATISTICS HARDENING of
# POST_FAILURE_EXPLORATORY_TARGET_V2
# (configs/evaluation/post_failure_exploratory_target_v2.yaml, identity
# 2f1beb0b95f01051e06c0ef8a82d06a759d0fe8f81f693c5d3a4d777845196a9).
#
# V2 was NEVER scientifically executed: no target feature package has been
# scientifically opened under V2, no SiW-Mv2 prediction has been generated,
# no target label has been opened, no target metric has been observed. This
# is the FINAL corrected protocol before any target access. V1 and V2 are
# preserved byte-for-byte as historical pre-target designs; V3 never writes
# into either namespace.

