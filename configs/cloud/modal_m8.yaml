# M8 Modal wrapper configuration.
#
# Workspace/environment are recorded at run time from the active Modal profile;
# no token, account id or local absolute path belongs in this file.
cloud_schema_version: "m8-modal-v1"
app_name: "prism-fas-b-m8"

volumes:
  data:
    name: "prism-fas-b-data"
    mount: "/vol/data"
    mode: read_only
  models:
    name: "prism-fas-b-models"
    mount: "/vol/models"
    mode: read_only
  runs:
    name: "prism-fas-b-runs"
    mount: "/vol/runs"
    mode: read_write

remote_paths:
  package: "/vol/data/packages/prism_data_v1_m3b"
  weight_root: "/vol/models/pretrained/m8"
  runs_root: "/vol/runs/runs"
  synthetic_work: "/vol/runs/synthetic_banks/m8_work"
  exports: "/vol/runs/exports"

package:
  expected_package_id: "prism_data_v1_m3b"
  expected_content_identity_sha256: "b1cf29b69a165ed5d9e074fc8127c17fbf057723edf9e272048ec3a564eb9dc6"
  expected_split_counts:
    source_train: 1440
    source_dev: 2079
    target_test: 3140
  # M8 opens source_train only; the other splits are counted from the lock but
  # their manifests are never read.
  opened_splits: ["source_train"]

recipe_bank:
  bank_id: "prism_recipe_bank_m7_v1"
  expected_identity_sha256: "fa989938cafdc4887518cc45c35d559d00278358439dc68c2486da10309210cb"

quality_models:
  identity:
    revision: "60a65befbcf7"
    sha256: "43bd2d570584d95d4a17ce81f26449034c45dbeed750afcab651872abc0e1496"
  parsing:
    revision: "fd12148d0b19"
    sha256: "327a755849ba64d336fb96589ff87b27e84a12be1ecf8bcfaa503d66f803286d"
  detector:
    revision: null
    sha256: "5838f7fe053675b1c7a08b633df49e7af5495cee0493c7dcf6697200b85b5b91"

gpu:
  # One GPU. H100/H200/B200 are never requested; L40S is a documented fallback
  # only after a real L4 OOM or availability failure.
  allow_list: ["L4", "L40S"]
  default: "L4"
  fallback: "L40S"
  fallback_policy: "documented_after_real_l4_oom_or_unavailability"

timeouts_seconds:
  environment_probe: 600
  gpat_smoke: 3600
  train_gpat: 21600
  calibrate_quality: 10800
  build_synthetic_bank: 21600
  validate_synthetic_bank: 3600

image:
  python_version: "3.11"
  pip_packages:
    - "torch==2.5.1"
    - "torchvision==0.20.1"
    - "numpy==2.1.3"
    - "pyarrow==18.1.0"
    - "opencv-python-headless==4.10.0.84"
    - "onnxruntime==1.20.1"
    - "pydantic==2.10.3"
    - "typer==0.15.1"
    - "PyYAML==6.0.2"

runs:
  gpat_smoke_run_id: "gpat_m8_smoke_seed20260806"
  gpat_train_run_id: "gpat_m8_seed20260806"
  seed: 20260806
