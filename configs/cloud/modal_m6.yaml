cloud_schema_version: "m6-modal-v1"
app_name: "prism-fas-b-m6"

# Workspace/environment are recorded at run time from the active Modal profile;
# no token, account id or local absolute path belongs in this file.
volumes:
  data:
    name: "prism-fas-b-data"
    mount: "/vol/data"
    mode: read_only
  models:
    name: "prism-fas-b-models"
    mount: "/vol/models"
    mode: read_only
  runs:
    name: "prism-fas-b-runs"
    mount: "/vol/runs"
    mode: read_write

remote_paths:
  package: "/vol/data/packages/prism_data_v1_m3b"
  model_dir: "/vol/models/pretrained/b00"
  parity_inputs: "/vol/runs/parity_inputs/b00_local_seed42"
  runs_root: "/vol/runs/runs"

package:
  expected_package_id: "prism_data_v1_m3b"
  expected_content_identity_sha256: "b1cf29b69a165ed5d9e074fc8127c17fbf057723edf9e272048ec3a564eb9dc6"
  expected_split_counts:
    source_train: 1440
    source_dev: 2079
    target_test: 3140

model:
  model_name: "convnextv2_atto.fcmae_ft_in1k"
  weight_sha256: "6389c2f5a427b01a922e66e6d352c707424cccb62390c6936bc612e3d10b7ebb"

gpu:
  allow_list: ["L4", "T4", "A10G"]
  default: "L4"

timeouts_seconds:
  environment_probe: 600
  verify_package: 1800
  forward_parity: 1200
  train_smoke: 1800
  inference_parity: 1200

image:
  python_version: "3.11"
  pip_packages:
    - "torch==2.5.1"
    - "torchvision==0.20.1"
    - "timm==1.0.28"
    - "numpy==2.1.3"
    - "pyarrow==18.1.0"
    - "opencv-python-headless==4.10.0.84"
    - "pydantic==2.10.3"
    - "typer==0.15.1"
    - "PyYAML==6.0.2"

parity:
  source_dev_samples: 32
  target_samples: 16
  precision: fp32
  # Pre-declared tolerances; never widened after seeing results.
  tolerances:
    logit_max_abs_diff: 1.0e-3
    logit_mean_abs_diff: 2.0e-4
    probability_max_abs_diff: 2.5e-4
    loss_abs_diff: 5.0e-4
    feature_min_cosine: 0.99999
    decision_ambiguous_band: 1.0e-3

train_smoke:
  run_id: "b00_modal_smoke_seed42"
  steps: 5
  resume_steps: 6
  batch_size: 32
  seed: 42
  num_workers: 2
