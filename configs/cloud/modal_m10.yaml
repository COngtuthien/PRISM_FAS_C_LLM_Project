# M10 Modal wrapper configuration.
#
# NOTHING IN THIS FILE HAS BEEN LAUNCHED. No M10 Modal app has ever been created;
# this is a declaration of what a future M10 app would mount and request.
#
# The wrapper only orchestrates: `src/prism_fas/evaluation/**` never imports modal
# (spec Table 41 / section 12.1), exactly as `src/prism_fas/detector/**` does not.
#
# Volumes are REUSED, never duplicated. `prism-fas-b-data`, `prism-fas-b-models`
# and `prism-fas-b-runs` already exist from M6/M8/M9.
cloud_schema_version: "m10-modal-v1"
app_name: "prism-fas-b-m10"
app_created: false

volumes:
  data:
    name: "prism-fas-b-data"
    mount: "/vol/data"
    mode: read_only
  models:
    name: "prism-fas-b-models"
    mount: "/vol/models"
    mode: read_only
  runs:
    name: "prism-fas-b-runs"
    mount: "/vol/runs"
    mode: read_write

remote_paths:
  package: "/vol/data/packages/prism_data_v1_m3b"
  synthetic_bank: "/vol/data/synthetic_banks/prism_synthetic_bank_m8_v3_e84c78cd2a9b"
  weight_root: "/vol/models/pretrained/m9"
  runs_root: "/vol/runs/runs"
  cache_root: "/vol/runs/m9_cache"
  # The additive target FEATURE package. Not yet built and not yet uploaded.
  target_feature_package: "/vol/data/packages/prism_target_v2_siwmv2_full"

# --- the mount firewall, expressed as mounts ---------------------------------
#
# Training and G7 containers get DIFFERENT mount sets. The evaluator-only label
# artifact is never uploaded to `prism-fas-b-data` and never appears in any mount
# below; G8 runs locally against the local label artifact.
mounts_by_stage:
  train:   {package: read_only, synthetic_bank: read_only, weight_root: read_only,
            runs_root: read_write, target_feature_package: not_mounted,
            target_label_artifact: not_mounted}
  g7:      {package: not_mounted, synthetic_bank: not_mounted, weight_root: read_only,
            runs_root: read_write, target_feature_package: read_only,
            target_label_artifact: not_mounted}
  g8:      {backend: local_only, target_label_artifact: local_read_only,
            runs_root: local_read_only}

target_label_artifact:
  uploaded_to_any_volume: false
  reachable_from_any_modal_image: false
  reason: "G8 is the only stage permitted to resolve a label path, and G8 runs locally"

package:
  expected_package_id: "prism_data_v1_m3b"
  expected_content_identity_sha256: "b1cf29b69a165ed5d9e074fc8127c17fbf057723edf9e272048ec3a564eb9dc6"
  opened_splits_by_stage:
    train: ["source_train", "source_dev"]
    g7: []                # G7 opens the TARGET feature package, not this one
  target_test_opened_by_training: false

gpu:
  allow_list: ["L4", "L40S"]
  default: "L4"
  fallback: "L40S"
  fallback_policy: "documented_after_real_l4_oom_or_unavailability"

timeouts_seconds:
  environment_probe: 900
  train_matrix_row: 86400
  target_predict: 10800
  target_ingest: 86400

image:
  python_version: "3.11"
  pip_packages:
    - "torch==2.5.1"
    - "torchvision==0.20.1"
    - "numpy==2.1.3"
    - "pyarrow==18.1.0"
    - "opencv-python-headless==4.10.0.84"
    - "timm==1.0.11"
    - "transformers==4.49.0"
    - "safetensors==0.4.5"
    - "sentencepiece==0.2.0"
    - "pydantic==2.10.3"
    - "PyYAML==6.0.2"

concurrency:
  # One job per experiment row. A duplicate launch for a row that already has a
  # RUNNING or COMPLETED registry entry is refused by the registry, not by hand.
  max_parallel_rows: 2
  refuse_duplicate_launch: true
