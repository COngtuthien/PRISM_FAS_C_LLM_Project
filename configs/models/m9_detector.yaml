# M9 PRISM regional CNN-VLM detector.
#
# Spec section 9.2 (Table 32) fixes the architecture, section 9.3 (Table 33) the
# manifolds and section 9.4 (Table 34) the fusion. Values the spec does not fix are
# marked SPEC_UNDERSPECIFIED here and in docs/M9_DETECTOR_CONTRACT.md; none of them
# may be presented as a spec requirement.
model_schema_version: "m9-prism-detector-v1"
experiment_id: m9_prism_detector
stage: M9

# --- immutable inputs ------------------------------------------------------
source_package:
  expected_package_id: prism_data_v1_m3b
  expected_content_identity_sha256: "b1cf29b69a165ed5d9e074fc8127c17fbf057723edf9e272048ec3a564eb9dc6"

synthetic_bank:
  # The ONLY bank M9 may open. Not the v1 bank, not the v2 bank, not a working
  # namespace, not a rejected candidate.
  bank_id: "prism_synthetic_bank_m8_v3_e84c78cd2a9b"
  expected_content_identity_sha256: "e84c78cd2a9b548244e243de0380998d04bc6770b91caf32ac7be96f489bb542"
  require_status: validated
  accepted_samples: 871
  route_counts: {physics: 419, gpat: 452}

