[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prism-fas"
version = "0.1.0"
description = "PRISM-FAS-B local data-factory infrastructure"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6,<7", "typer>=0.12,<1", "pyarrow>=25,<26"]

[project.scripts]
prism = "prism_fas.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/prism_fas"]
